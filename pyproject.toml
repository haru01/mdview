[project]
name = "mdview"
version = "0.1.0"
description = "Readable TUI markdown viewer with SVG image rendering"
authors = [
    { email = "e-ienaga@esm.co.jp" }
]
requires-python = ">=3.11"
dependencies = [
    "cairosvg>=2.9.0",
    "regex>=2026.5.9",
    "textual>=8.2.7",
    "textual-image[textual]>=0.12.0",
]

[project.scripts]
mdview = "mdview.cli:main"

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
